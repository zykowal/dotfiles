format = """\
[╭╴](fg:arrow)\
$username\
$os\
(\
    in \
    $directory\
)\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$hg_branch\
$hg_state\
$cmd_duration\
(\
    $package\
    $c\
    $cmake\
    $cobol\
    $daml\
    $dart\
    $deno\
    $dotnet\
    $elixir\
    $elm\
    $erlang\
    $fennel\
    $fortran\
    $gleam\
    $golang\
    $guix_shell\
    $haskell\
    $haxe\
    $helm\
    $java\
    $julia\
    $kotlin\
    $gradle\
    $lua\
    $nim\
    $nodejs\
    $ocaml\
    $opa\
    $perl\
    $php\
    $pulumi\
    $purescript\
    $python\
    $quarto\
    $raku\
    $rlang\
    $red\
    $ruby\
    $rust\
    $scala\
    $solidity\
    $swift\
    $terraform\
    $typst\
    $vlang\
    $vagrant\
    $zig\
    $buf\
    $nix_shell\
    $conda\
    $meson\
    $spack\
    $memory_usage\
    $aws\
    $gcloud\
    $openstack\
    $azure\
    $nats\
    $direnv\
    $env_var\
)
[╰─](fg:arrow)$character\
"""

add_newline = true

palette = "normal"

[palettes.normal]
arrow = "#a1a1a1"
os = "#a6e3a1"
os_admin = "#e4ff1a"
directory = "#9ffff5"
time = "#bdfffd"
node = "#a5e6ba"
git = "#f17f29"
git_status = "#DFEBED"
duration = "#ce4257"
text_color = "#EDF2F4"
text_light = "#26272A"

[username]
style_user = 'bold os'
style_root = 'bold os_admin'
format = '[🦊 $user](fg:$style) '
disabled = false
show_always = true

[os]
format = "on [($name)]($style) "
style = "bold blue"
disabled = true

[os.symbols]
Alpaquita = " "
Alpine = " "
AlmaLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = "󰛓 "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = "󰈸 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = " "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = "󰈺 "
openSUSE = " "
OracleLinux = "󰌷 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
RockyLinux = " "
Redox = "󰀘 "
Solus = "󰠳 "
SUSE = " "
Ubuntu = " "
Unknown = " "
Void = " "
Windows = "󰍲 "
[character]
success_symbol = "[>](fg:arrow)"
error_symbol = "[>](fg:red)"

[directory]
format = "[$path](bold $style)[$read_only]($read_only_style) "
style = "fg:directory"
read_only_style = "fg:directory"
before_repo_root_style = "fg:directory"
truncate_to_repo = false
truncation_length = 0
read_only = "  "

[cmd_duration]
format = "took [ $duration]($style) "
style = "bold fg:duration"
min_time = 500

[docker_context]
disabled = true
symbol = " "

[fill]
symbol = " "

[nodejs]
symbol = " "
disabled = false

[python]
disabled = false
symbol = " "

[conda]
ignore_base = false
disabled = true
symbol = " "

[java]
symbol = " "
disabled = false

[c]
symbol = " "
disabled = false

[cpp]
disabled = false
symbol = " "

[rust]
symbol = " "
disabled = false

[perl]
symbol = " "

[php]
symbol = " "

[pijul_channel]
symbol = " "

[pixi]
symbol = "󰏗 "

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[scala]
symbol = " "

[swift]
symbol = " "

[xmake]
symbol = " "

[zig]
symbol = " "

[julia]
symbol = " "

