# fix: If you use homebrew install tmux, you should add the following line to your ~/.tmux.conf
set-environment -g PATH "/opt/homebrew/bin:/bin:/usr/bin"

set -g mouse on
set -g set-clipboard on
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g focus-events on
set -g renumber-windows on
set -g detach-on-destroy off
set -g popup-border-style 'fg=colour240,bg=default'

set -g status-keys emacs
setw -g aggressive-resize on

set -g status-style bg=default,fg=colour240
set -g window-status-current-format "#I:(✓)#{window_name}"
set -g status-right "[#{session_name}] %A %m-%d-%Y"
set -g status-left ""

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -sg escape-time 0
set -g repeat-time 600
set -g display-time 2000
set -g history-limit 10000

bind-key x kill-pane

unbind C-b
set -g prefix C-\;
bind-key C-\; send-prefix

unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"

unbind [
bind \; copy-mode

unbind r
bind r source-file ~/.tmux.conf

bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5

bind -r m resize-pane -Z

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

bind-key "f" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --prompt '⚡  ' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'laktak/extrakto'

set -g @extrakto_key "s"
set -g @extrakto_insert_key "ctrl-i"
set -g @extrakto_copy_key "ctrl-l"
set -g @extrakto_popup_size "80%"

bind C-l send-keys 'C-l'
unbind -n C-\\

set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
run '~/.tmux/plugins/tpm/tpm'
